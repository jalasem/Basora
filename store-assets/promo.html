<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Basora promo tile</title>
  <style>
    * { box-sizing: border-box; }
    body { display: grid; place-items: center; width: 440px; height: 280px; margin: 0; overflow: hidden; color: #fff; background: radial-gradient(circle at 85% 10%, #4e3cca 0, transparent 37%), linear-gradient(145deg, #11194e 0%, #17105f 100%); font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    main { display: grid; grid-template-columns: 104px 1fr; gap: 24px; align-items: center; width: 100%; padding: 42px; }
    img { width: 104px; height: 104px; filter: drop-shadow(0 14px 22px #080a2c66); }
    .eyebrow { margin: 0 0 8px; color: #bbb7ff; font-size: 10px; font-weight: 800; letter-spacing: .15em; text-transform: uppercase; }
    h1 { margin: 0 0 8px; font-size: 34px; line-height: 1; letter-spacing: -.04em; }
    p:last-child { margin: 0; color: #d9dcf8; font-size: 13px; line-height: 1.4; }
  </style>
</head>
<body>
  <main>
    <img src="../assets/basora-logo.png" alt="">
    <div><p class="eyebrow">Docs to README</p><h1>Basora</h1><p>Clean Markdown from any documentation trail.</p></div>
  </main>
</body>
</html>
