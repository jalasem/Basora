<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Basora store screenshot</title>
  <style>
    * { box-sizing: border-box; }
    body { width: 1280px; height: 800px; margin: 0; overflow: hidden; color: #17213a; background: linear-gradient(135deg, #f6f7ff 0%, #eceaff 100%); font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    .shell { display: grid; grid-template-columns: minmax(0, 1fr) 410px; gap: 26px; width: 100%; height: 100%; padding: 40px; }
    .document { position: relative; overflow: hidden; padding: 38px 46px; border: 1px solid #e2e5f0; border-radius: 24px; background: #fff; box-shadow: 0 22px 60px #30305e18; }
    .brand { display: flex; gap: 11px; align-items: center; margin-bottom: 42px; color: #5146d8; font-size: 15px; font-weight: 800; letter-spacing: -.01em; }
    .brand img { width: 36px; height: 36px; }
    .eyebrow { margin: 0 0 12px; color: #7168c8; font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    h1 { max-width: 650px; margin: 0 0 18px; color: #151b34; font-size: 49px; line-height: 1.05; letter-spacing: -.045em; }
    .intro { max-width: 660px; margin: 0 0 40px; color: #667085; font-size: 19px; line-height: 1.5; }
    .doc-block { max-width: 680px; padding-top: 25px; border-top: 1px solid #ebedf4; }
    .doc-block h2 { margin: 0 0 12px; font-size: 22px; }
    .lines { display: grid; gap: 10px; }
    .line { height: 9px; border-radius: 999px; background: #e9ebf3; }
    .line:nth-child(1) { width: 96%; } .line:nth-child(2) { width: 88%; } .line:nth-child(3) { width: 70%; }
    .code { width: 82%; margin-top: 22px; padding: 18px; border-radius: 12px; background: #171b31; }
    .code span { display: block; width: 86%; height: 8px; margin: 8px 0; border-radius: 99px; background: #7770df; }
    .code span:nth-child(2) { width: 68%; background: #9a95ed; } .code span:nth-child(3) { width: 76%; background: #5fd5bd; }
    .panel { overflow: hidden; border: 1px solid #dedfeb; border-radius: 22px; background: #f7f8fc; box-shadow: 0 24px 65px #24235524; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <main class="shell">
    <section class="document">
      <div class="brand"><img src="../assets/basora-logo.png" alt="">Basora</div>
      <p class="eyebrow">Docs to README</p>
      <h1>Turn documentation into clean Markdown.</h1>
      <p class="intro">Capture pages manually or let Basora follow the documentation trail, then download one portable README with its media assets.</p>
      <div class="doc-block">
        <h2>Creating an application</h2>
        <div class="lines"><div class="line"></div><div class="line"></div><div class="line"></div></div>
        <div class="code"><span></span><span></span><span></span></div>
      </div>
    </section>
    <aside class="panel"><iframe src="../popup.html?mode=panel" title="Basora side panel"></iframe></aside>
  </main>
</body>
</html>
